name: Screener diario
on:
  schedule:
    - cron: "0 22 * * 1-5"   # 19:00 hora Argentina, lunes a viernes
  workflow_dispatch:          # permite ejecutarlo a mano
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python screener_yahoo.py
      - name: Guardar resultados
        run: |
          mkdir -p historial
          cp resultado_screener.csv "historial/$(date +%F).csv"
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add resultado_screener.csv historial
          git commit -m "Resultado $(date +%F)" || echo "Sin cambios"
          git pull --rebase
          git push
