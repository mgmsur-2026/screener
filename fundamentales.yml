name: Datos fundamentales
on:
  schedule:
    - cron: "0 11 * * 0"   # domingos 08:00 hora Argentina
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fundamentales:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python fundamentales.py
      - name: Guardar resultados
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fundamentales.csv
          git commit -m "Fundamentales $(date +%F)" || echo "Sin cambios"
          git pull --rebase
          git push
