name: Rendimiento histórico
on:
  schedule:
    - cron: "0 12 * * 0"   # domingos 09:00 hora Argentina
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python backtest.py
      - name: Guardar resultados
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest_resumen.json backtest_eventos.csv
          git commit -m "Backtest $(date +%F)" || echo "Sin cambios"
          git pull --rebase
          git push
